# ══════════════════════════════════════════════════════════════════════════════
# Nginx — KidrooToys Production Configuration
# ══════════════════════════════════════════════════════════════════════════════
#
# SETUP (run once):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/kidrootoys
#   sudo ln -s /etc/nginx/sites-available/kidrootoys /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (run once after DNS is pointing to your VPS):
#   sudo certbot --nginx -d kidrootoys.co -d www.kidrootoys.co
#   Certbot will automatically modify this file to add SSL config.
#
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name kidrootoys.co www.kidrootoys.co;

    # ── Frontend: Serve React static files ──────────────────────────────────
    root /opt/kidrootoys/frontend/dist;
    index index.html;

    # SPA routing — all frontend routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend: Reverse proxy API requests to Node.js ──────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Swagger Docs → Backend ──────────────────────────────────────────────
    location /docs {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health Check → Backend ──────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Static Asset Caching ────────────────────────────────────────────────
    # Vite hashes filenames, so we can cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Gzip Compression ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── Security Headers ───────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Logging ────────────────────────────────────────────────────────────
    access_log /var/log/nginx/kidrootoys_access.log;
    error_log /var/log/nginx/kidrootoys_error.log;
}
