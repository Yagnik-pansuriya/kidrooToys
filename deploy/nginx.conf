# ══════════════════════════════════════════════════════════════════════════════
# Nginx — KidrooToys Production Configuration
# ══════════════════════════════════════════════════════════════════════════════
#
# SETUP (run once):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/kidroo
#   sudo ln -s /etc/nginx/sites-available/kidroo /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (run once after DNS is pointing to your VPS):
#   sudo certbot --nginx -d kidroo.in -d www.kidroo.in
#   Certbot will automatically modify this file to add SSL config.
#
# ══════════════════════════════════════════════════════════════════════════════

# One canonical host: www.kidroo.in → kidroo.in (duplicate hosts split ranking)
# After certbot, make sure the HTTPS (443) www server block also returns this 301.
server {
    listen 80;
    listen [::]:80;
    server_name www.kidroo.in;
    return 301 https://kidroo.in$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name kidroo.in;

    client_max_body_size 50M;

    # ── Frontend: Serve React static files ──────────────────────────────────
    root /var/www/kidrooToys/frontend/dist;
    index index.html;

    # Pages: real static files are served directly; every other path is an
    # HTML page and goes to the backend SEO renderer, which returns the SPA
    # shell with per-page <title>, meta, canonical, JSON-LD, crawlable HTML
    # and a real 404 status for unknown products/categories.
    # (No "$uri/" here — it would serve dist/index.html for "/" unrendered.)
    location / {
        try_files $uri @seo_render;
    }

    location @seo_render {
        rewrite ^(.*)$ /seo-render$1 break;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        # Backend down → fall back to the plain SPA so the shop keeps working
        error_page 502 503 504 = @spa_fallback;
    }

    location @spa_fallback {
        try_files /index.html =404;
    }

    # Live sitemap from the database (the static dist/sitemap.xml can be stale)
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000/sitemap.xml;
        proxy_set_header Host $host;
        error_page 502 503 504 = @static_sitemap;
    }

    location @static_sitemap {
        try_files /sitemap.xml =404;
    }

    # ── Backend: Reverse proxy API requests to Node.js ──────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Swagger Docs → Backend ──────────────────────────────────────────────
    location /docs {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health Check → Backend ──────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Static Asset Caching ────────────────────────────────────────────────
    # Vite hashes filenames, so we can cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Gzip Compression ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── Security Headers ───────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Logging ────────────────────────────────────────────────────────────
    access_log /var/log/nginx/kidroo_access.log;
    error_log /var/log/nginx/kidroo_error.log;
}
