# ══════════════════════════════════════════════════════════════════════════════
# Docker Compose — Production Stack (Caddy + Frontend + Backend + Redis)
# ══════════════════════════════════════════════════════════════════════════════
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml down
#   docker compose -f docker-compose.prod.yml logs -f
#
# ══════════════════════════════════════════════════════════════════════════════

services:
  # ── Caddy — Reverse Proxy + Auto HTTPS ────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # SSL certificates
      - caddy_config:/config    # Caddy config cache
      - caddy_logs:/data/logs   # Access logs
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - kidroo-network

  # ── Frontend — Nginx serving React SPA ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # No ports exposed to host — Caddy handles external traffic
    expose:
      - "80"
    networks:
      - kidroo-network

  # ── Backend — Node.js Express API ─────────────────────────────────────────
  backend:
    build:
      context: ./kidrooBackend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - ./kidrooBackend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kidroo-network

  # ── Redis — Caching Layer ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No ports exposed to host — only accessible within Docker network
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kidroo-network

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  caddy_data:       # Persists SSL certificates across restarts
  caddy_config:     # Caddy internal config
  caddy_logs:       # Access logs
  redis_data:       # Redis persistence (AOF)

# ── Network ──────────────────────────────────────────────────────────────────
networks:
  kidroo-network:
    driver: bridge
