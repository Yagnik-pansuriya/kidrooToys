<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default SEO Meta Tags (overridden dynamically per page by SEOHead component) -->
    <meta name="description" content="Kidroo Toys - Where Imagination Comes to Play! Shop premium toys, educational kits, action figures, and more for kids of all ages. Free shipping on ₹500+." />
    <meta name="keywords" content="kidroo, toys, kids, children, educational toys, action figures, building blocks, wooden toys, montessori, baby toys" />
    <meta name="author" content="Kidroo Toys" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FF6B35" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kidroo Toys" />
    <meta property="og:title" content="Kidroo Toys - Where Imagination Comes to Play 🧸" />
    <meta property="og:description" content="Shop premium toys, educational kits, action figures, and more for kids of all ages. Free shipping on ₹500+." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kidroo Toys - Where Imagination Comes to Play 🧸" />
    <meta name="twitter:description" content="Shop premium toys, educational kits, action figures, and more for kids of all ages." />

    <title>Kidroo Toys - Where Imagination Comes to Play 🧸</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- JSON-LD WebSite Structured Data (enables Google Sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Kidroo Toys",
      "alternateName": "Kidroo",
      "url": "https://kidrootoys.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://kidrootoys.com/shop?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
